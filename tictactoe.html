<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      min-height: 1.6rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win { background: #0f3460; animation: pulse 0.5s ease; }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    #btn-restart { background: #e94560; color: #fff; }

    #mode-label { color: #888; font-size: 0.9rem; }

    .toggle-group {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e94560;
    }

    .toggle-btn {
      padding: 8px 18px;
      background: transparent;
      color: #e94560;
      border: none;
      border-radius: 0;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #e94560;
      color: #fff;
    }

    #score {
      display: flex;
      gap: 32px;
      font-size: 1rem;
      color: #888;
    }

    #score span { color: #eee; font-weight: bold; }

    .score-x { color: #e94560 !important; }
    .score-o { color: #a8dadc !important; }
  </style>
</head>
<body>

<h1>TIC TAC TOE</h1>

<div id="score">
  <div>X <span id="score-x" class="score-x">0</span></div>
  <div>Draws <span id="score-d">0</span></div>
  <div>O <span id="score-o" class="score-o">0</span></div>
</div>

<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <div>
    <div id="mode-label">Mode</div>
    <div class="toggle-group">
      <button class="toggle-btn active" id="btn-2p">2 Players</button>
      <button class="toggle-btn" id="btn-ai">vs AI</button>
    </div>
  </div>
  <button id="btn-restart">Restart</button>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, over, vsAI, scores = {X:0, O:0, D:0};

  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');

  function init() {
    board = Array(9).fill('');
    current = 'X';
    over = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = "X's turn";
  }

  function checkWinner(b) {
    for (const [a, bb, c] of WINS) {
      if (b[a] && b[a] === b[bb] && b[a] === b[c]) return { winner: b[a], line: [a, bb, c] };
    }
    if (b.every(v => v)) return { winner: 'draw' };
    return null;
  }

  function applyMove(i, player) {
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player.toLowerCase(), 'taken');
  }

  function endGame(result) {
    over = true;
    if (result.winner === 'draw') {
      status.textContent = "It's a draw!";
      scores.D++;
    } else {
      status.textContent = `${result.winner} wins!`;
      result.line.forEach(i => cells[i].classList.add('win'));
      scores[result.winner]++;
    }
    document.getElementById('score-x').textContent = scores.X;
    document.getElementById('score-o').textContent = scores.O;
    document.getElementById('score-d').textContent = scores.D;
  }

  function humanMove(i) {
    if (over || board[i]) return;
    applyMove(i, current);
    const result = checkWinner(board);
    if (result) { endGame(result); return; }
    current = current === 'X' ? 'O' : 'X';
    status.textContent = `${current}'s turn`;
    if (vsAI && current === 'O') setTimeout(aiMove, 300);
  }

  // Minimax AI
  function minimax(b, isMax) {
    const r = checkWinner(b);
    if (r) return r.winner === 'O' ? 10 : r.winner === 'X' ? -10 : 0;
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) { b[i] = 'O'; best = Math.max(best, minimax(b, false)); b[i] = ''; }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) { b[i] = 'X'; best = Math.min(best, minimax(b, true)); b[i] = ''; }
      }
      return best;
    }
  }

  function aiMove() {
    if (over) return;
    let best = -Infinity, move = -1;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = 'O';
        const score = minimax(board, false);
        board[i] = '';
        if (score > best) { best = score; move = i; }
      }
    }
    applyMove(move, 'O');
    const result = checkWinner(board);
    if (result) { endGame(result); return; }
    current = 'X';
    status.textContent = "X's turn";
  }

  cells.forEach(c => c.addEventListener('click', () => humanMove(+c.dataset.i)));

  document.getElementById('btn-restart').addEventListener('click', init);

  document.getElementById('btn-2p').addEventListener('click', () => {
    vsAI = false;
    document.getElementById('btn-2p').classList.add('active');
    document.getElementById('btn-ai').classList.remove('active');
    init();
  });

  document.getElementById('btn-ai').addEventListener('click', () => {
    vsAI = true;
    document.getElementById('btn-ai').classList.add('active');
    document.getElementById('btn-2p').classList.remove('active');
    init();
  });

  init();
</script>
</body>
</html>
